spring.application.name=stay-orchestrator
# ===========================================
# DATABASE CONFIGURATION
# ===========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/travel
spring.datasource.username=travel_user
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================================
# JPA / HIBERNATE CONFIGURATION
# ===========================================
# validate: vérifie que le schéma correspond aux entités (ne modifie pas la DB)
spring.jpa.hibernate.ddl-auto=validate

# Formate les requêtes SQL dans les logs
spring.jpa.properties.hibernate.format_sql=true

# Affiche les requêtes SQL dans les logs (optionnel)
# spring.jpa.show-sql=true

# ===========================================
# CACHE CONFIGURATION
# ===========================================
spring.cache.type=redis

# Configuration Redis (si nécessaire)
# spring.data.redis.host=localhost
# spring.data.redis.port=6379

# ===========================================
# SERVER CONFIGURATION
# ===========================================
server.port=8080

spring.application.name=stay-orchestrator

# ===========================================
# DATABASE CONFIGURATION
# ===========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/travel
spring.datasource.username=travel_user
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# ===========================================
# JPA / HIBERNATE CONFIGURATION
# ===========================================
# update: create/update schema automatically (dev mode)
# validate: verify schema matches entities (production mode)
# Reset to allow Flyway-managed schema
spring.jpa.hibernate.ddl-auto=none

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Show SQL queries in logs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===========================================
# REDIS CACHE CONFIGURATION
# ===========================================
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000

# ===========================================
# SERVER CONFIGURATION
# ===========================================
server.port=8080
server.error.include-message=always
server.error.include-stacktrace=never

# ===========================================
# LOGGING CONFIGURATION
# ===========================================
logging.level.root=INFO
logging.level.so.stay.orchestrator=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===========================================
# SWAGGER / OPENAPI CONFIGURATION
# ===========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true


spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7

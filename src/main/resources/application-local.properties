spring.application.name=stay-orchestrator

# ===========================================
# DATABASE CONFIGURATION (H2 - Local Profile)
# ===========================================
spring.datasource.url=jdbc:h2:mem:staydb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ===========================================
# JPA / HIBERNATE CONFIGURATION
# ===========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===========================================
# H2 CONSOLE
# ===========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===========================================
# CACHE CONFIGURATION (Local)
# ===========================================
spring.cache.type=none
spring.data.redis.repositories.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration, org.springframework.boot.autoconfigure.cache.CacheAutoConfiguration

# ===========================================
# SERVER CONFIGURATION
# ===========================================
server.port=8080
server.error.include-message=always
server.error.include-stacktrace=never

# ===========================================
# LOGGING CONFIGURATION
# ===========================================
logging.level.root=INFO
logging.level.so.stay.orchestrator=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===========================================
# SWAGGER / OPENAPI CONFIGURATION
# ===========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

app.cors.allowed-origins=http://localhost:3000,http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
